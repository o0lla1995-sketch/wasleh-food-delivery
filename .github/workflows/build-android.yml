name: Build Wasleh Android Apps

# Builds RELEASE APKs (with embedded JS bundle - works without Metro server)
# Output artifacts (kept 90 days):
#   - wasleh-customer-release.apk (com.wasleh.customer)
#   - wasleh-driver-release.apk (com.wasleh.driver)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug or release-apk)'
        required: true
        default: 'release-apk'
        type: choice
        options:
          - debug
          - release-apk
  push:
    branches:
      - main
    paths:
      - 'user-side/**'
      - 'driver-app/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    branches:
      - main

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  build-customer:
    name: Build Customer App APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: user-side/yarn.lock

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          packager: yarn
          expo-cache: true

      - name: Install dependencies
        working-directory: user-side
        run: yarn install --no-immutable

      - name: Verify Firebase config
        working-directory: user-side
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json not found in user-side/."
            exit 1
          fi
          echo "✓ google-services.json present"

      - name: Create .env from .env.example (if missing)
        working-directory: user-side
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "✓ Created .env from .env.example"
          else
            echo "✓ .env already present"
          fi

      - name: Generate native Android project (if missing)
        working-directory: user-side
        run: |
          if [ ! -d android ]; then
            npx expo prebuild --platform android --no-install
          else
            echo "✓ android/ folder exists"
          fi

      - name: Verify wasleh.keystore is in place
        working-directory: user-side/android/app
        run: |
          if [ ! -f wasleh.keystore ]; then
            echo "ERROR: wasleh.keystore not found in user-side/android/app/"
            exit 1
          fi
          echo "✓ wasleh.keystore present"

      - name: Set gradle properties
        working-directory: user-side/android
        run: |
          if ! grep -q "FLIPPER_VERSION" gradle.properties; then
            echo "FLIPPER_VERSION=0.182.0" >> gradle.properties
          fi

      - name: Build APK (release)
        working-directory: user-side/android
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release-apk' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "=== Building DEBUG APK ==="
            ./gradlew :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../wasleh-customer-debug.apk
          else
            echo "=== Building RELEASE APK (self-contained, no Metro needed) ==="
            ./gradlew :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../../wasleh-customer-release.apk
          fi

      - name: Verify APK contains JS bundle (release only)
        working-directory: user-side
        if: ${{ (github.event.inputs.build_type || 'release-apk') != 'debug' }}
        run: |
          APK_PATH="../wasleh-customer-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "=== APK contents (assets folder) ==="
            unzip -l "$APK_PATH" | grep -E "assets/index.android.bundle|assets/index.android.bundle.meta" || {
              echo "✗ ERROR: index.android.bundle not found in APK!"
              echo "The APK will crash with 'Unable to load script' on the phone."
              exit 1
            }
            echo "✓ JS bundle is embedded - APK will work standalone on the phone"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasleh-customer-apk
          path: wasleh-customer-*.apk
          retention-days: 90
          if-no-files-found: error

  build-driver:
    name: Build Driver App APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'yarn'
          cache-dependency-path: driver-app/yarn.lock

      - name: Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          packager: yarn
          expo-cache: true

      - name: Install dependencies
        working-directory: driver-app
        run: yarn install --no-immutable

      - name: Verify Firebase config
        working-directory: driver-app
        run: |
          if [ ! -f google-services.json ]; then
            echo "ERROR: google-services.json not found in driver-app/."
            exit 1
          fi
          echo "✓ google-services.json present"

      - name: Create .env from .env.example (if missing)
        working-directory: driver-app
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "✓ Created .env from .env.example"
          else
            echo "✓ .env already present"
          fi

      - name: Generate native Android project
        working-directory: driver-app
        run: npx expo prebuild --platform android --no-install

      - name: Copy wasleh.keystore to android/app/
        working-directory: driver-app
        run: |
          cp wasleh.keystore android/app/wasleh.keystore
          echo "✓ Copied wasleh.keystore to android/app/"

      - name: Patch build.gradle to add release signing config
        working-directory: driver-app/android/app
        run: |
          # Check if release signingConfig is already in place
          if grep -q "signingConfigs.release" build.gradle; then
            echo "✓ build.gradle already has release signing config"
          else
            echo "=== Patching build.gradle ==="
            # Use Python for reliable multi-line replacement
            python3 << 'PYEOF'
            with open('build.gradle', 'r') as f:
                content = f.read()

            # 1. Add release block to signingConfigs
            old_signing = """    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }"""
            new_signing = """    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            storeFile file('wasleh.keystore')
            storePassword 'wasleh123'
            keyAlias 'wasleh'
            keyPassword 'wasleh123'
        }
    }"""
            if old_signing in content:
                content = content.replace(old_signing, new_signing)
                print("  ✓ Added release block to signingConfigs")
            else:
                print("  ⚠ Could not find expected signingConfigs block (may already be patched)")

            # 2. Change release buildType to use signingConfigs.release
            old_release = """        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug"""
            new_release = """        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.release"""
            if old_release in content:
                content = content.replace(old_release, new_release)
                print("  ✓ Updated release buildType to use signingConfigs.release")
            else:
                print("  ⚠ Could not find release buildType block (may already be patched)")

            with open('build.gradle', 'w') as f:
                f.write(content)
            PYEOF
          fi
          
          echo ""
          echo "=== Verify: signingConfigs section ==="
          grep -A2 "signingConfigs\|release {" build.gradle | head -25

      - name: Set gradle properties
        working-directory: driver-app/android
        run: |
          if ! grep -q "FLIPPER_VERSION" gradle.properties; then
            echo "FLIPPER_VERSION=0.182.0" >> gradle.properties
          fi

      - name: Build APK (release)
        working-directory: driver-app/android
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type || 'release-apk' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            echo "=== Building DEBUG APK ==="
            ./gradlew :app:assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../../wasleh-driver-debug.apk
          else
            echo "=== Building RELEASE APK (self-contained, no Metro needed) ==="
            ./gradlew :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../../wasleh-driver-release.apk
          fi

      - name: Verify APK contains JS bundle (release only)
        working-directory: driver-app
        if: ${{ (github.event.inputs.build_type || 'release-apk') != 'debug' }}
        run: |
          APK_PATH="../wasleh-driver-release.apk"
          if [ -f "$APK_PATH" ]; then
            echo "=== APK contents (assets folder) ==="
            unzip -l "$APK_PATH" | grep -E "assets/index.android.bundle|assets/index.android.bundle.meta" || {
              echo "✗ ERROR: index.android.bundle not found in APK!"
              echo "The APK will crash with 'Unable to load script' on the phone."
              exit 1
            }
            echo "✓ JS bundle is embedded - APK will work standalone on the phone"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasleh-driver-apk
          path: wasleh-driver-*.apk
          retention-days: 90
          if-no-files-found: error
